# ===== Perfil dev: MySQL (docker compose up -d) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:nexus}
spring.datasource.password=${DB_PASSWORD:nexus}

# db/migration = tabelas (todos os ambientes) | db/seed = dados de exemplo (so dev/h2/test)
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.show-sql=false
