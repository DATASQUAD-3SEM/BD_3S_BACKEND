<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus · FUSEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
    <span></span><span></span><span></span>
  </button>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-mark">N</span>
        <span class="sidebar__brand-name">Nexus</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação principal">
        <ul id="menuList" class="sidebar__list">
          <!-- Itens do menu são inseridos dinamicamente por js/app.js, conforme o perfil logado -->
        </ul>
      </nav>

      <div class="sidebar__footer">
        <div class="user-card">
          <div class="user-card__avatar" id="userInitials">--</div>
          <div class="user-card__info">
            <span class="user-card__name" id="userName">Carregando...</span>
            <span class="user-card__role" id="userRole">—</span>
          </div>
        </div>
        <button class="link-button" id="logoutButton" type="button">Sair</button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <div class="main">
      <header class="topbar">
        <h1 class="topbar__title" id="pageTitle">Painel</h1>
      </header>

      <main class="content" id="content">
        <!-- Conteúdo da página ativa é inserido aqui por js/app.js -->
      </main>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
