# ===== Perfil h2: banco em memoria, ZERO instalacao =====
# Rode com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Os dados somem quando a aplicacao para.
spring.datasource.url=jdbc:h2:mem:nexus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/seed
