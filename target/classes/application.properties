# ===== Configuracao COMUM (vale para todos os perfis) =====
spring.application.name=nexus

# Perfil padrao = dev (MySQL). Para rodar sem MySQL use o perfil h2 (veja README).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# O banco e criado/alterado SOMENTE pelo Flyway (pasta db/migration).
# O Hibernate NUNCA mexe nas tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Upload de encaminhamento (foto ou PDF)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Onde os arquivos enviados ficam guardados (solucao provisoria, ver docs/DECISOES_PENDENTES.md)
nexus.storage.local-dir=./uploads

# Front (Vite) que pode chamar a API. Varias origens: separe por virgula.
# Wildcards em IP privado cobrem o acesso pelo celular / IP da rede (docs/REDE_E_CELULAR.md).
# Quando login/JWT entrar (Sprint 2), trocar por dominios fixos.
nexus.cors.allowed-origins=http://localhost:*,https://localhost:*,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*,https://*.trycloudflare.com

management.endpoints.web.exposure.include=health


